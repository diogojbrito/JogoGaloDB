<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <!-- Faz o site ajustar-se ao ecrã do telemóvel -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo do Galo</title>

    <!-- PWA: ficheiro com a informação da app -->
    <link rel="manifest" href="manifest.json">
    <!-- PWA: cor da barra do browser -->
    <meta name="theme-color" content="#333333">
    <!-- PWA: ícone para iPhone/iPad -->
    <link rel="apple-touch-icon" href="icons/icon-192.png">

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <h1>Jogo do Galo</h1>

   
    <p>Vez do jogador: <span id="currentPlayer">X</span></p>

  
    <div class="board">
        <div class="cell" onclick="makeMove(this)"></div>
        <div class="cell" onclick="makeMove(this)"></div>
        <div class="cell" onclick="makeMove(this)"></div>
        <div class="cell" onclick="makeMove(this)"></div>
        <div class="cell" onclick="makeMove(this)"></div>
        <div class="cell" onclick="makeMove(this)"></div>
        <div class="cell" onclick="makeMove(this)"></div>
        <div class="cell" onclick="makeMove(this)"></div>
        <div class="cell" onclick="makeMove(this)"></div>
    </div>


    <button onclick="resetGame()">Novo Jogo</button>
    <button id="firstPlayerBtn" onclick="changeFirstPlayer()">Começa: X</button>

    
    <div id="winModal" class="modal">
        <div class="modal-box">
            <p id="winMessage"></p>
            <button onclick="closeModal()">Jogar outra vez</button>
        </div>
    </div>

    
    <script src="js/game.js"></script>

    <!-- PWA: regista o service worker (faz o jogo funcionar offline) -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>

</body>
</html>
